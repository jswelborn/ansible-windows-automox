---
- name: Check and remediate Windows Automox Agent service
  hosts: all
  gather_facts: false

  vars:
    service_name: amagent

  tasks:
    - name: Gather Automox Agent service info
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: automox_service_info
      ignore_unreachable: true

    - name: End compliance check for unreachable host
      ansible.builtin.meta: end_host
      when: automox_service_info is ansible.builtin.unreachable

    - name: Fail if Automox Agent service is missing
      ansible.builtin.fail:
        msg: "Automox Agent service is missing"
      when: not automox_service_info.exists

    - name: Start Automox Agent service when it is stopped
      ansible.windows.win_service:
        name: "{{ service_name }}"
        state: started
        start_mode: auto
      when:
        - automox_service_info.exists
        - automox_service_info.services[0].state != "started"

    - name: Refresh Automox Agent service info after remediation
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: automox_remediation_info
      ignore_unreachable: true

    - name: End compliance check if host became unreachable
      ansible.builtin.meta: end_host
      when: automox_remediation_info is ansible.builtin.unreachable

    - name: Fail if Automox Agent service is still not running
      ansible.builtin.fail:
        msg: "Automox Agent service exists but could not be started"
      when:
        - automox_remediation_info.exists
        - automox_remediation_info.services[0].state != "started"