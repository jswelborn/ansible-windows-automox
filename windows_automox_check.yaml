---
- name: Check and remediate Windows Automox Agent service
  hosts: all
  gather_facts: false

  vars:
    service_name: amagent

  tasks:
    - name: Gather Automox Agent service info
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: automox_service_info
      ignore_unreachable: true
      failed_when: false

    - name: End compliance check when service information could not be gathered
      ansible.builtin.meta: end_host
      when:
        - automox_service_info.unreachable | default(false) or
          automox_service_info.failed | default(false)

    - name: Fail if Automox Agent service is missing
      ansible.builtin.fail:
        msg: "Automox Agent service is missing"
      when:
        - not automox_service_info.exists | default(false)

    - name: Start Automox Agent service when it is stopped
      ansible.windows.win_service:
        name: "{{ service_name }}"
        state: started
        start_mode: auto
      when:
        - automox_service_info.exists
        - automox_service_info.services[0].state != "started"

    - name: Refresh Automox Agent service info after remediation
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: automox_remediation_info
      ignore_unreachable: true
      failed_when: false

    - name: End compliance check when service information could not be refreshed
      ansible.builtin.meta: end_host
      when:
        - automox_remediation_info.unreachable | default(false) or
          automox_remediation_info.failed | default(false)

    - name: Fail if Automox Agent service is still not running
      ansible.builtin.fail:
        msg: "Automox Agent service exists but could not be started"
      when:
        - automox_remediation_info.exists | default(false)
        - automox_remediation_info.services[0].state != "started"