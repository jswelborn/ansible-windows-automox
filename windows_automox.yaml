---
- name: Install and configure Automox on Windows
  hosts: all
  gather_facts: false

  vars_files:
    - vars/automox.yaml

  vars:
    automox_policy_group: "{{ policy_group | default('staging') }}"
    automox_working_dir: 'C:\Temp'
    automox_install_script: "{{ automox_working_dir }}\\Install-AxAgentMsi.ps1"
    automox_service_name: "amagent"

  pre_tasks:
    - name: Set Kerberos password variable
      ansible.builtin.set_fact:
        kerberos_password: "{{ ansible_password | default(ansible_ssh_pass | default('')) }}"

    - name: Obtain Kerberos ticket
      ansible.builtin.shell: |
        printf '%s\n' "{{ kerberos_password }}" | /usr/bin/kinit -V "{{ ansible_user }}"
      delegate_to: localhost
      changed_when: false
      no_log: true

    - name: Gather Windows facts
      ansible.windows.setup:

  tasks:
    - name: Ensure Automox access key was provided by AAP credential
      ansible.builtin.assert:
        that:
          - automox_accesskey is defined
          - automox_accesskey | length > 0
        fail_msg: "automox_accesskey was not provided by the attached AAP credential."
      no_log: true

    - name: Check whether Automox service exists
      ansible.windows.win_shell: |
        $svc = Get-Service -Name "{{ automox_service_name }}" -ErrorAction SilentlyContinue
        if ($null -ne $svc) { "present" } else { "absent" }
      register: automox_service_check
      changed_when: false

    - name: End host if Automox agent is already installed
      ansible.builtin.meta: end_host
      when: "'present' in automox_service_check.stdout"

    - name: Ensure temp directory exists
      ansible.windows.win_file:
        path: "{{ automox_working_dir }}"
        state: directory

    - name: Copy Automox install script
      ansible.windows.win_copy:
        src: files/Install-AxAgentMsi.ps1
        dest: "{{ automox_install_script }}"

    - name: Run Automox install script
      ansible.windows.win_shell: |
        & "{{ automox_install_script }}" -AccessKey "{{ automox_accesskey }}"
      register: automox_install_result
      no_log: true

    - name: Allow Windows services to settle after Automox install
      ansible.builtin.pause:
        seconds: 60

    - name: Reset WinRM connection after Automox install
      ansible.builtin.meta: reset_connection

    - name: Wait for WinRM after Automox install
      ansible.builtin.wait_for_connection:
        delay: 15
        timeout: 300

    - name: Ensure Automox service is started
      ansible.windows.win_service:
        name: "{{ automox_service_name }}"
        state: started
      register: automox_service_result
      retries: 6
      delay: 15
      until: automox_service_result is succeeded